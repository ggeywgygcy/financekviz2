<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Путешествие в страну финансовой независимости — пульт команды</title><style>

:root {
  --bg: #0b1220;
  --bg2: #111c30;
  --card: #15233b;
  --card2: #1b2d4a;
  --line: #2a4166;
  --text: #e9f0fa;
  --muted: #9db0c9;
  --accent: #2f8fe0;
  --accent2: #2fbf8a;
  --ok: #2fbf8a;
  --bad: #d4655c;
  --gold: #e0b84c;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background: linear-gradient(160deg, #080e1a 0%, #10223a 100%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}
#app { max-width: 720px; margin: 0 auto; padding: 12px; }
h1 { font-size: 1.7rem; margin: 0 0 8px; line-height: 1.2; }
h2 { font-size: 1.25rem; margin: 0 0 12px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  margin-bottom: 14px;
}
.hero { text-align: center; }
.hero .emoji { font-size: 3rem; }
button {
  font: inherit;
  color: var(--text);
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 18px;
  min-height: 54px;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, input:focus-visible {
  outline: 3px solid #9fd0ff;
  outline-offset: 2px;
}
.btn-primary { background: #1f6fb5; border-color: var(--accent); color: #fff; font-weight: 600; }
.btn-primary:hover:not(:disabled) { background: var(--accent); }
.btn-danger { border-color: var(--bad); color: #f3b8b3; }
.stack { display: grid; gap: 10px; }
input[type="text"] {
  font: inherit;
  width: 100%;
  color: var(--text);
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  min-height: 54px;
}
.scorebar {
  position: sticky; top: 0; z-index: 5;
  background: linear-gradient(90deg, #14355c, #135e4a);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px 16px;
  margin-bottom: 14px;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
}
.scorebar .team { font-weight: 700; word-break: break-word; }
.scorebar .pts { font-size: 1.5rem; font-weight: 800; white-space: nowrap; }
.board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.cell {
  position: relative;
  aspect-ratio: 1 / 1;
  min-height: 72px;
  padding: 4px;
  font-size: 1.8rem;
  font-weight: 800;
  color: #fff;
  border: 2px solid rgba(255, 255, 255, 0.25);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  line-height: 1.1;
}
.cell .tiny { font-size: 0.7rem; font-weight: 600; margin-top: 2px; }
.cell.done { border-color: #fff; }
.cell .mark {
  position: absolute; top: 4px; right: 6px; font-size: 0.8rem;
  background: rgba(0, 0, 0, 0.45); border-radius: 999px; padding: 0 7px;
}
.cell:hover:not(:disabled) { border-color: #fff; }
.question-title { color: var(--accent2); font-weight: 700; margin-bottom: 8px; }
.question { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; }
.options { display: grid; gap: 10px; margin-bottom: 16px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 14px; }
.opt .letter {
  flex: 0 0 auto; width: 34px; height: 34px; border-radius: 9px;
  background: var(--bg2); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; font-weight: 700;
}
.opt.picked { border-color: var(--gold); }
.opt.correct { background: #17503f; border-color: var(--ok); }
.opt.wrong { background: #4a2523; border-color: var(--bad); }
.grade { display: grid; gap: 10px; grid-template-columns: repeat(3, 1fr); margin-bottom: 14px; }
.grade button { font-weight: 700; padding: 10px 6px; font-size: 0.95rem; }
.grade button.active { background: #1f6fb5; border-color: var(--accent); color: #fff; }
.grade button.active.g0 { background: #7a3330; border-color: var(--bad); }
.explain {
  margin: 0 0 14px; padding: 14px; border-radius: 12px;
  background: var(--bg2); border-left: 4px solid var(--accent2);
}
.stats { display: grid; gap: 10px; grid-template-columns: repeat(3, 1fr); margin: 14px 0; }
.stat { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; }
.stat b { display: block; font-size: 1.7rem; }
.big-score { font-size: 3rem; font-weight: 800; color: var(--accent2); text-align: center; }
.phrase { text-align: center; font-size: 1.1rem; padding: 12px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line); }
.modal-back {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65);
  display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10;
}
.modal {
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  max-width: 520px; width: 100%; max-height: 90vh; overflow: auto; padding: 20px;
}
.modal ul { padding-left: 20px; margin: 0 0 14px; }
.modal li { margin-bottom: 6px; }
@media (min-width: 560px) {
  .board { grid-template-columns: repeat(6, 1fr); }
}

.notice{padding:14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);margin:12px 0}
@media(min-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div id="app"></div><script>

ься, не проверяя условия"],"correctIndex":2,"explanation":"План с конкретным сроком и регулярными взносами помогает достичь цели."},{"question":"Как быстрее сформировать финансовый резерв?","options":["Ориентироваться только на рекламу","Не учитывать расходы и последствия","Сразу согласиться, не проверяя условия","Регулярно откладывать часть дохода после обязательных расходов"],"correctIndex":3,"explanation":"Регулярность важнее случайных крупных взносов."},{"question":"Как рассчитать ежемесячное накопление?","options":["Разделить нужную сумму на число месяцев до цели","Сразу согласиться, не проверяя условия","Оформить кредит ради этой покупки","Ориентироваться только на рекламу"],"correctIndex":0,"explanation":"Так получается понятный ориентир ежемесячного взноса."},{"question":"Что делать, если доход временно снизился?","options":["Сразу согласиться, не проверяя условия","Пересмотреть расходы и скорректировать план","Ориентироваться только на рекламу","Не учитывать расходы и последствия"],"correctIndex":1,"explanation":"Бюджет должен учитывать реальные доходы и обязательные платежи."},{"question":"Зачем разделять накопления по целям?","options":["Оформить кредит ради этой покупки","Ориентироваться только на рекламу","Чтобы видеть прогресс и не тратить деньги одной цели на другую","Сразу согласиться, не проверяя условия"],"correctIndex":2,"explanation":"Раздельные цели упрощают контроль над деньгами."}]},{"id":3,"locationName":"Дорога / Парковка","questions":[{"question":"Какое утверждение об ОСАГО и КАСКО верно?","options":["Оформить кредит ради этой покупки","Ориентироваться только на рекламу","Не учитывать расходы и последствия","ОСАГО обязательно страхует ответственность, КАСКО добровольно защищает автомобиль"],"correctIndex":3,"explanation":"ОСАГО и КАСКО защищают разные финансовые интересы."},{"question":"Что учесть кроме цены при покупке автомобиля?","options":["Топливо, страховку, обслуживание, налоги и ремонт","Не учитывать расходы и последствия","Сразу со ловия","Чтобы начисления учитывали фактическое потребление","Ориентироваться только на рекламу"],"correctIndex":2,"explanation":"Своевременные показания помогают избежать расчётов по нормативу."},{"question":"Как планировать коммунальные платежи?","options":["Сразу согласиться, не проверяя условия","Оформить кредит ради этой покупки","Ориентироваться только на рекламу","Включать их в ежемесячный бюджет и оплачивать вовремя"],"correctIndex":3,"explanation":"Коммунальные услуги — регулярные обязательные расходы."},{"question":"Что делать при ошибке в квитанции?","options":["Обратиться к исполнителю услуги и запросить проверку","Ориентироваться только на рекламу","Не учитывать расходы и последствия","Сразу согласиться, не проверяя условия"],"correctIndex":0,"explanation":"Ошибку следует оспаривать через официальные каналы."}]},{"id":5,"locationName":"Интернет-магазин","questions":[{"question":"Пришло СМС о задержке заказа со ссылкой для ввода карты. Что делать?","options":["Оформить кредит ради этой покупки","Проверить заказ в официальном приложении или на сайте","Не учитывать расходы и последствия","Сразу согласиться, не проверяя условия"],"correctIndex":1,"explanation":"Ссылка может вести на фишинговую страницу."},{"question":"Как безопаснее оплачивать покупки в интернете?","options":["Ориентироваться только на рекламу","Не учитывать расходы и последствия","На проверенном сайте и безопасным способом оплаты","Оформить кредит ради этой покупки"],"correctIndex":2,"explanation":"Проверяйте адрес сайта и не передавайте секретные коды."},{"question":"Цена товара подозрительно ниже рыночной. Что сделать?","options":["Не учитывать расходы и последствия","Сразу согласиться, не проверяя условия","Оформить кредит ради этой покупки","Проверить продавца, отзывы и условия возврата"],"correctIndex":3,"explanation":"Слишком низкая цена может быть приманкой мошенников."},{"question":"Что проверить перед нажатием «Оплатить»?","options":["Итоговую сумму, доставку, продавца и состав зак сти и избегать дорогого ремонта","Сразу согласиться, не проверяя условия","Оформить кредит ради этой покупки"],"correctIndex":1,"explanation":"Плановое обслуживание снижает риск серьёзных поломок."},{"question":"Как сравнить два автомобиля с разной ценой покупки?","options":["Не учитывать расходы и последствия","Сразу согласиться, не проверяя условия","Оценить цену, топливо, страховку, ремонт, налоги и перепродажу","Ориентироваться только на рекламу"],"correctIndex":2,"explanation":"Дешевле при покупке не всегда дешевле в эксплуатации."},{"question":"Что сделать перед покупкой подержанного автомобиля?","options":["Сразу согласиться, не проверяя условия","Оформить кредит ради этой покупки","Ориентироваться только на рекламу","Провести диагностику и проверить документы и историю"],"correctIndex":3,"explanation":"Независимая проверка помогает выявить риски."},{"question":"Как снизить расход топлива?","options":["Поддерживать правильное давление в шинах и избегать резких ускорений","Ориентироваться только на рекламу","Не учитывать расходы и последствия","Сразу согласиться, не проверяя условия"],"correctIndex":0,"explanation":"Спокойное вождение и исправность автомобиля помогают экономить."}]},{"id":17,"locationName":"Магазин / Киоск","questions":[{"question":"Почему небольшие ежедневные покупки опасны для бюджета?","options":["Оформить кредит ради этой покупки","Они незаметно складываются в существенную сумму","Не учитывать расходы и последствия","Сразу согласиться, не проверяя условия"],"correctIndex":1,"explanation":"Мелкие регулярные расходы за месяц могут быть значительными."},{"question":"Как понять, сколько уходит на перекусы и мелочи?","options":["Ориентироваться только на рекламу","Не учитывать расходы и последствия","Вести учёт расходов хотя бы несколько недель","Оформить кредит ради этой покупки"],"correctIndex":2,"explanation":"Записи показывают реальные траты."},{"question":"Что сделать перед покупкой мелочи у кассы?","options":["Не учитывать расходы и последствия","Сразу согласиться, не проверяя условия","Оформить кредит ради этой покупки","Спросить себя, нужна ли она и предусмотрена ли бюджетом"],"correctIndex":3,"explanation":"Пауза помогает избежать импульсивной покупки."},{"question":"Как накопить за счёт сокращения мелких трат?","options":["Откладывать деньги, сэкономленные на необязательных покупках","Оформить кредит ради этой покупки","Ориентироваться только на рекламу","Не учитывать расходы и последствия"],"correctIndex":0,"explanation":"Регулярные небольшие суммы постепенно складываются."},{"question":"Какой инструмент помогает контролировать повседневные траты?","options":["Оформить кредит ради этой покупки","Бюджет или приложение учёта расходов","Не учитывать расходы и последствия","Сразу согласиться, не проверяя условия"],"correctIndex":1,"explanation":"Учёт показывает, куда уходят деньги."}]}];
const STORAGE_KEY = "finance-pult-save-v2";
const LETTERS = ["A","B","C","D"];
let state = {screen:"start",team:"",history:{},cell:null,questionIndex:null,picked:null,revealed:false};
let showRules = false;
function fresh(){return {screen:"start",team:"",history:{},cell:null,questionIndex:null,picked:null,revealed:false};}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;const d=JSON.parse(raw);if(d&&typeof d==="object"){state=Object.assign(fresh(),d);if(!state.history||typeof state.history!=="object")state.history={};if(state.cell!==null&&state.questionIndex!==null){const c=QUESTIONS.find(x=>x.id===state.cell);if(!c||!c.questions[state.questionIndex])state=fresh();}}}catch(e){state=fresh();}}
function allAnswers(){return Object.values(state.history).flatMap(x=>Object.values(x||{}));}
function totalScore(){return allAnswers().reduce((s,a)=>s+(a.correct?2:0),0);}
function answeredCount(){return allAnswers().length;}
function countCorrect(){return allAnswers().filter(a=>a.correct).length;}
function countWrong(){return allAnswers().filter(a=>!a.correct).length;}
function answeredForCell(id){return Object.keys(state.history[id]||{}).length;}
function motivation(){const n=answeredCount();if(!n)return "Вы пока не ответили ни на один вопрос. Начните путешествие!";const r=totalScore()/(n*2);if(r>=.85)return "Блестяще! Вы настоящие финансовые эксперты и уверенно идёте к независимости.";if(r>=.6)return "Отличный результат! Вы хорошо разбираетесь в финансах, осталось отточить детали.";if(r>=.35)return "Неплохо! База есть, а над некоторыми темами стоит ещё поработать.";return "Это только начало пути. Повторите правила финансовой грамотности и сыграйте ещё раз.";}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function startGame(){const input=document.getElementById("team-input"),name=input.value.trim();if(!name){input.focus();return;}state=fresh();state.team=name.slice(0,30);state.screen="board";save();render();}
function openCell(id){const c=QUESTIONS.find(x=>x.id===id);if(!c)return;const used=Object.keys(state.history[id]||{}).map(Number);const free=c.questions.map((_,i)=>i).filter(i=>!used.includes(i));state.cell=id;state.picked=null;state.revealed=false;if(!free.length){state.questionIndex=null;state.screen="exhausted";}else{state.questionIndex=free[Math.floor(Math.random()*free.length)];state.screen="question";}save();render();window.scrollTo(0,0);}
function pickOption(i){if(state.revealed)return;const c=QUESTIONS.find(x=>x.id===state.cell),q=c&&c.questions[state.questionIndex];if(!q||i<0||i>3)return;state.picked=i;state.revealed=true;if(!state.history[state.cell])state.history[state.cell]={};state.history[state.cell][state.questionIndex]={correct:i===q.correctIndex,picked:i};save();render();}
function backToBoard(){state.screen="board";state.cell=null;state.questionIndex=null;state.picked=null;state.revealed=false;save();render();window.scrollTo(0,0);}
function finishGame(){if(!confirm("Завершить игру и перейти к итогам?"))return;state.screen="results";state.cell=null;save();render();window.scrollTo(0,0);}
function playAgain(){const team=state.team;state=fresh();state.team=team;state.screen="board";save();render();}
function newTeam(){state=fresh();save();render();}
function render(){const app=document.getElementById("app");if(state.screen==="board")app.innerHTML=renderScorebar()+renderBoard();else if(state.screen==="question")app.innerHTML=renderScorebar()+renderQuestion();else if(state.screen==="exhausted")app.innerHTML=renderScorebar()+renderExhausted();else if(state.screen==="results")app.innerHTML=renderResults();else app.innerHTML=renderStart();if(showRules)app.insertAdjacentHTML("beforeend",renderRules());}
function renderScorebar(){return '<div class="scorebar"><span class="team">Команда «'+esc(state.team)+'»</span><span class="pts">'+totalScore()+' очк.</span></div>';}
function renderStart(){return '<div class="card hero"><div class="emoji">🧭💰</div><h1>Путешествие в страну финансовой независимости</h1><p class="muted">Пульт команды: выбирайте клетку, отвечайте на вопросы и набирайте очки.</p></div><form class="card stack" data-form="start"><label for="team-input"><b>Введите название команды</b></label><input type="text" id="team-input" maxlength="30" placeholder="Например, Брокеры" value="'+esc(state.team)+'"><button type="submit" class="btn-primary">Начать игру</button><button type="button" data-action="rules">Правила</button></form>';}
function renderRules(){return '<div class="modal-back" data-action="close-rules"><div class="modal" role="dialog" aria-modal="true" aria-label="Правила"><h2>Правила</h2><ul><li>Бросайте кубик и ходите по клеткам на плакате (номера от 1 до 17).</li><li>Нажмите номер клетки, на которой оказалась ваша фишка.</li><li>На каждой клетке есть пять вопросов. При повторном посещении выбирается ещё не использованный вопрос.</li><li>Выберите один из четырёх вариантов. Проверка происходит автоматически.</li><li>За верный ответ начисляется 2 очка, за неверный — 0.</li><li>После ответа появятся правильный вариант и пояснение. Повторно ответить на тот же вопрос нельзя.</li><li>Прогресс сохраняется в браузере даже после перезагрузки.</li><li>Когда игра закончится, нажмите «Завершить игру», чтобы увидеть итог.</li></ul><button class="btn-primary" data-action="close-rules-btn" style="width:100%">Понятно</button></div></div>';}
function renderBoard(){const cells=QUESTIONS.map((q,i)=>{const n=answeredForCell(q.id),h=Math.round(i*360/QUESTIONS.length),bg="linear-gradient(145deg,hsl("+h+",60%,38%),hsl("+((h+30)%360)+",62%,30%))";return '<button class="cell'+(n?' done':'')+'" style="background:'+bg+'" data-action="cell" data-id="'+q.id+'" aria-label="Клетка '+q.id+', '+esc(q.locationName)+', отвечено '+n+' из 5">'+(n?'<span class="mark">'+n+'/5</span>':'')+q.id+'<span class="tiny">'+(n?'пройдено':'')+'</span></button>';}).join("");return '<div class="card"><h2>Выберите клетку</h2><p class="muted">Отвечено вопросов: '+answeredCount()+' из 85. На каждой клетке — 5 вопросов.</p><div class="board">'+cells+'</div></div><div class="stack"><button class="btn-danger" data-action="finish">Завершить игру</button><button data-action="rules">Правила</button></div>';}
function renderQuestion(){const c=QUESTIONS.find(x=>x.id===state.cell),q=c.questions[state.questionIndex],opts=q.options.map((t,i)=>{let cl="opt";if(state.revealed){if(i===q.correctIndex)cl+=" correct";else if(i===state.picked)cl+=" wrong";}return '<button class="'+cl+'" data-action="pick" data-i="'+i+'" '+(state.revealed?'disabled':'')+' aria-pressed="'+(state.picked===i)+'"><span class="letter">'+LETTERS[i]+'</span><span>'+esc(t)+'</span></button>';}).join("");const result=state.revealed?'<div class="explain"><b>'+(state.picked===q.correctIndex?'Верно! +2 балла.':'Неверно. +0 баллов.')+'</b><br>Правильный ответ: '+LETTERS[q.correctIndex]+'. '+esc(q.explanation)+'</div>':'';return '<div class="card"><div class="question-title">Клетка №'+c.id+': '+esc(c.locationName)+' · использовано '+answeredForCell(c.id)+'/5</div><div class="question">'+esc(q.question)+'</div><div class="options">'+opts+'</div>'+result+(state.revealed?'<button class="btn-primary" data-action="back" style="width:100%">Вернуться к выбору клетки</button>':'<p class="muted">Выберите один вариант ответа. Результат появится сразу.</p>')+'</div>';}
function renderExhausted(){const c=QUESTIONS.find(x=>x.id===state.cell);return '<div class="card"><h1>Клетка пройдена!</h1><div class="notice">Вы ответили на все вопросы этой клетки («'+esc(c.locationName)+'»).</div><p class="muted">Вы использовали все пять вопросов. Выберите другую клетку, чтобы продолжить игру.</p><button class="btn-primary" data-action="back" style="width:100%">Вернуться к выбору клетки</button></div>';}
function renderResults(){return '<div class="card"><h1 style="text-align:center">Итоги</h1><p class="muted" style="text-align:center">Команда «'+esc(state.team)+'»</p><div class="big-score">'+totalScore()+'</div><p class="muted" style="text-align:center">очков, пройдено вопросов: '+answeredCount()+' из 85</p><div class="stats"><div class="stat"><b>'+countCorrect()+'</b>Верных ответов</div><div class="stat"><b>'+countWrong()+'</b>Неверных ответов</div></div><div class="phrase">'+motivation()+'</div></div><div class="stack"><button class="btn-primary" data-action="again">Сыграть ещё раз</button><button data-action="new">Новая команда</button></div>';}
document.addEventListener("click",e=>{const el=e.target.closest("[data-action]");if(!el)return;const a=el.dataset.action;if(a==="close-rules"){if(e.target===el){showRules=false;render();}return;}switch(a){case"rules":showRules=true;render();break;case"close-rules-btn":showRules=false;render();break;case"cell":openCell(Number(el.dataset.id));break;case"pick":pickOption(Number(el.dataset.i));break;case"back":backToBoard();break;case"finish":finishGame();break;case"again":playAgain();break;case"new":newTeam();break;}});
document.addEventListener("submit",e=>{if(e.target.dataset.form==="start"){e.preventDefault();startGame();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&showRules){showRules=false;render();}});
load();render();

</script></body></html>
